<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Raindrop 书签同步</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header"><div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#0066FF"/><path d="M2 17L12 22L22 17" stroke="#0066FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12L12 17L22 12" stroke="#0066FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>Raindrop 同步</h1></div></header>
    <div id="not-authenticated" class="section hidden"><div class="status-box warning"><span class="status-icon">⚠️</span> <span>尚未连接 Raindrop.io</span></div><p class="setup-hint">请先在设置中配置测试令牌。</p><button id="open-settings-btn" class="btn btn-primary btn-full">打开设置</button></div>
    <div id="authenticated" class="section hidden"><div class="user-info"><span class="user-avatar">👤</span> <span id="user-name" class="user-name">加载中…</span> <button id="disconnect-btn" class="btn btn-small btn-secondary">断开连接</button></div><div class="status-section"><div class="status-row"><span class="label">状态：</span> <span id="sync-status" class="status-badge">未知</span></div><div class="status-row"><span class="label">已同步文件夹：</span> <span id="mappings-count">0</span></div><div class="status-row"><span class="label">书签总数：</span> <span id="links-count">0</span></div><div class="status-row"><span class="label">上次同步：</span> <span id="last-sync">从未</span></div></div><div class="toggle-section"><label class="toggle-label"><span>启用同步</span> <input type="checkbox" id="sync-toggle" class="toggle-input"> <span class="toggle-slider"></span></label></div><div class="actions"><button id="sync-now-btn" class="btn btn-primary btn-full">立即同步</button></div></div>
    <footer class="footer"><a href="#" id="options-link" class="footer-link">设置</a> <span class="separator">•</span> <span class="version" id="version">v1.0.0</span></footer>
  </div>
  <script src="../popup.js"></script>
</body>
</html>
